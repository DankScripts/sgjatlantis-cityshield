plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.106'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "sgjatlantis-dhd-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Stargate Journey 1.21.1 0.6.48-hotfix1 (CurseForge file 8670937)
    implementation 'curse.maven:sgjourney-689083:8670937'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
