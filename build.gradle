plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.106'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    implementation "curse.maven:sgjourney-689083:${sgjourney_file_id}"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources').configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, mod_authors: mod_authors,
                      mod_description: mod_description]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat', 'build.gradle',
                'settings.gradle', 'gradle.properties', 'README.md', 'CHANGELOG.md', 'LICENSE.txt'
    }
}

tasks.register('releaseJar', Copy) {
    dependsOn 'build'
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('dist'))
}

tasks.register('release') { dependsOn 'releaseJar', 'sourceArchive' }