plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.106'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    def localSgJourney = file(System.getenv('SGJOURNEY_JAR') ?:
            "libs/Stargate Journey-${minecraft_version}-0.6.55-alpha.jar")
    if (!localSgJourney.isFile()) {
        throw new GradleException("Private SGJourney build input missing. Set SGJOURNEY_JAR or place the supplied 0.6.55-alpha JAR at ${localSgJourney}.")
    }
    logger.lifecycle("SGJourney build input: ${localSgJourney}")
    implementation files(localSgJourney)
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources').configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, mod_authors: mod_authors,
                      mod_description: mod_description]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(projectDir) {
        include 'src/**', 'tools/**', 'gradle/**', 'gradlew', 'gradlew.bat', 'build.gradle',
                'settings.gradle', 'gradle.properties', 'README.md', 'CHANGELOG.md', 'LICENSE.txt'
    }
}

tasks.register('releaseJar', Copy) {
    dependsOn 'build'
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('dist'))
}

tasks.register('release') { dependsOn 'releaseJar', 'sourceArchive' }

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.register('verifyRendererRegistration', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dankscripts.sgjatlantis_cityshield.client.RendererRegistrationCheck'
}

tasks.register('verifyReleaseJar') {
    dependsOn 'jar', 'sourceArchive'
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def sourceFile = tasks.named('sourceArchive', Zip).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { jarZip ->
            new java.util.zip.ZipFile(sourceFile).withCloseable { sourceZip ->
                def missingSource = jarZip.entries().findAll { entry ->
                    entry.name.startsWith('com/dankscripts/sgjatlantis_cityshield/') && entry.name.endsWith('.class')
                }.collect { entry ->
                    entry.name.replaceFirst(/\$.*/, '').replaceFirst(/\.class$/, '') + '.java'
                }.unique().findAll { path -> sourceZip.getEntry("src/main/java/${path}") == null }
                if (!missingSource.isEmpty()) {
                    throw new GradleException("Release classes without published source: ${missingSource}")
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyRendererRegistration', 'verifyReleaseJar'
}